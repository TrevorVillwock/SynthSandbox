<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Synth Sandbox</title>
        <meta name="description" content="A simple synthesizer">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
        <script src='https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.53/Tone.js'></script>
        <script src='./synthSandbox.js' defer></script>
    </head>
    <body>
        <div id="popup" class="modal" style="display:block">
            <div id="modal-content">
                <span id="start-box" class="close" onclick="closeModal()">Click to start</span>
            </div>
        </div>

        <div class="app">
            <header class="rack-header">
                <h1 id="project-name">Synth Sandbox</h1>
            </header>

            <div class="rack">

                <section class="panel" aria-labelledby="master-heading">
                    <h2 id="master-heading" class="panel-title">Master</h2>

                    <div id="button-container">
                        <button class="buttons" id="startButton" onclick="start()">Start</button>
                        <button class="buttons" id="stopButton" onclick="stop()">Stop</button>
                    </div>

                    <div class="toggle-row">
                        <div class="check-box-container">
                            <input class="check-box" type="checkbox" id="randomPitchButton" onclick="toggleRandomPitch()">
                            <label class="check-box-label" for="randomPitchButton">Random Pitch</label>
                        </div>
                        <div class="check-box-container">
                            <input class="check-box" type="checkbox" id="randomSpeedButton" onclick="toggleRandomSpeed()">
                            <label class="check-box-label" for="randomSpeedButton">Random Speed</label>
                        </div>
                    </div>

                    <div class="control">
                        <div class="control-label-row">
                            <label for="mainVolumeSlider">Volume</label>
                        </div>
                        <input type="range" min="0" max="200" value="0" id="mainVolumeSlider" class="control-slider" oninput="setMainVolume()">
                    </div>

                    <div class="control">
                        <div class="control-label-row">
                            <label for="speedSlider">Speed</label>
                            <span class="readout"><input class="number-box" type="number" id="speedNumber" value="50" readonly>BPM</span>
                        </div>
                        <input class="control-slider" type="range" min="50.0" max="500.0" value="50.0" id="speedSlider" oninput="setSpeed()">
                    </div>

                    <div class="control">
                        <div class="control-label-row">
                            <label for="pitchSlider">Base Pitch</label>
                            <span class="readout"><input class="number-box" type="number" id="pitchNumber" value="100" readonly>Hz</span>
                        </div>
                        <input class="control-slider" type="range" min="100" max="500" value="100" id="pitchSlider" oninput="setPitch()">
                    </div>

                    <div class="control">
                        <div class="control-label-row">
                            <label for="cutoffSlider">Low Pass Filter Cutoff</label>
                            <span class="readout"><input class="number-box" type="number" id="filterNumber" value="1500" readonly>Hz</span>
                        </div>
                        <input class="control-slider" type="range" min="1.0" max="14.3" step="0.01" value="10.6" id="cutoffSlider" oninput="setFilterCutoff()">
                    </div>
                </section>

                <section class="panel" aria-labelledby="mod-heading">
                    <h2 id="mod-heading" class="panel-title">Modulation</h2>

                    <div class="control">
                        <div class="control-label-row">
                            <label for="amSlider">Amplitude Modulation</label>
                        </div>
                        <input type="range" min="1" max="2" step="0.01" value="1" id="amSlider" class="control-slider" oninput="setAMFreq()">
                    </div>

                    <h3 class="sub-heading">Vibrato</h3>

                    <div class="control">
                        <div class="control-label-row">
                            <label for="vibratoFreqSlider">Frequency</label>
                        </div>
                        <input type="range" min="2" max="20" step="0.1" value="0.0" id="vibratoFreqSlider" class="control-slider" oninput="setVibratoFreq()">
                    </div>

                    <div class="control">
                        <div class="control-label-row">
                            <label for="vibratoRangeSlider">Range</label>
                        </div>
                        <input type="range" min="1.0" max="2.0" step="0.01" value="0.0" id="vibratoRangeSlider" class="control-slider" oninput="setVibratoRange()">
                    </div>

                    <img class="meme" src="https://trevorvillwock.github.io/synth_sandbox/annoying_sound.jpg" alt="Synth Sandbox mascot">
                </section>

                <section class="panel" aria-labelledby="fx-heading">
                    <h2 id="fx-heading" class="panel-title">Effects</h2>

                    <h3 class="sub-heading">Delay (Echo)</h3>

                    <div class="control">
                        <div class="control-label-row">
                            <label for="delayTimeSlider">Time</label>
                            <span class="readout"><input class="number-box delay-number" type="number" id="delayTimeNumber" value="0.5" readonly>Seconds</span>
                        </div>
                        <input class="control-slider" type="range" min="0.1" max="1.0" step="0.01" value="0.5" id="delayTimeSlider" oninput="setDelayTime()">
                    </div>

                    <div class="control">
                        <div class="control-label-row">
                            <label for="delayFeedbackSlider">Feedback</label>
                            <span class="readout"><input class="number-box delay-number" type="number" id="delayFeedbackNumber" value="0.3" readonly></span>
                        </div>
                        <input class="control-slider" type="range" min="0.0" max="0.9" step="0.01" value="0.3" id="delayFeedbackSlider" oninput="setDelayFeedback()">
                    </div>

                    <div class="control">
                        <div class="control-label-row">
                            <label for="delayVolumeSlider">Volume</label>
                        </div>
                        <input class="control-slider" type="range" min="0.0" max="1.0" value="0.5" step="0.01" id="delayVolumeSlider" oninput="setDelayVolume()">
                    </div>

                    <h3 class="sub-heading">Auto Filter</h3>

                    <div class="control">
                        <div class="control-label-row">
                            <label for="autoFilterRateSlider">Rate</label>
                        </div>
                        <input class="control-slider" type="range" min="0.25" max="20" value="1" id="autoFilterRateSlider" oninput="setAutoFilterRate()">
                    </div>
                </section>

            </div>
        </div>
    </body>
</html>
